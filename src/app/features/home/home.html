<main class="bg-neutral-50 text-neutral-950">
  <section aria-labelledby="hero-heading" class="px-5 pt-8 pb-14 md:px-8 md:pt-10 md:pb-20 xl:px-16">
    <div class="mx-auto max-w-6xl">
      <app-hero-card [hero]="hero" />
    </div>
  </section>

  <div class="bg-white">
    <section aria-labelledby="articles-heading" class="px-5 py-10 md:px-8 md:py-16 xl:px-16">
      <div class="mx-auto max-w-6xl">
        <div class="flex flex-col gap-6 md:gap-8">
          <div class="flex flex-col gap-4 md:flex-row md:items-end md:justify-between md:gap-6">
            <div class="min-w-0">
              <h1
                id="articles-heading"
                class="text-4xl font-bold leading-tight tracking-tight md:text-5xl"
              >
                Lorem ipsum dolor sit
              </h1>
              <p class="mt-4 text-xl leading-relaxed text-neutral-700">Lorem ipsum dolor sit</p>
            </div>

            <div class="w-full md:max-w-80">
              <app-search-input />
            </div>
          </div>

          <div class="grid grid-cols-1 gap-x-8 gap-y-10 md:grid-cols-2 xl:grid-cols-3">
            @for (article of articles; track article.id) {
              <app-article-card [article]="article" />
            }
          </div>
        </div>
      </div>
    </section>

    <app-feature-card [feature]="feature" />
  </div>
</main>
