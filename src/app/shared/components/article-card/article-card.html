<article class="flex h-full flex-col">
  @if (article().image; as image) {
    <div class="relative aspect-video w-full overflow-hidden rounded">
      <picture>
        <source media="(min-width: 1024px)" [srcset]="image.largeSrc" />
        <source media="(min-width: 768px)" [srcset]="image.mediumSrc" />
        <img
          [src]="image.smallSrc"
          [alt]="image.alt"
          class="size-full object-cover"
          decoding="async"
          loading="lazy"
          sizes="(min-width: 1024px) 22rem, (min-width: 768px) 45vw, 100vw"
        />
      </picture>
    </div>
  } @else {
    <div
      aria-hidden="true"
      class="flex aspect-video w-full items-center justify-center rounded bg-neutral-300 text-2xl font-bold text-neutral-400"
    >
      IMAGE
    </div>
  }

  <p class="mt-3 flex items-center gap-2 text-sm font-bold text-neutral-700">
    <img
      alt=""
      aria-hidden="true"
      class="size-4 shrink-0 text-neutral-500"
      src="/icons/calendar.svg"
    />
    <span>{{ article().category }}</span>
  </p>

  <h3 class="mt-3 text-2xl font-bold leading-tight text-neutral-950 md:text-3xl">
    {{ article().title }}
  </h3>

  <p class="mt-4 line-clamp-6 text-sm leading-relaxed text-neutral-700 md:text-base">
    {{ article().description }}
  </p>
</article>
