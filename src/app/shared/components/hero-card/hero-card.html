<article
  class="rounded-2xl border border-neutral-200 bg-white p-5 shadow-[0_2px_8px_rgba(15,23,42,0.08)] md:p-6"
>
  <div class="grid gap-5 md:items-start lg:grid-cols-[minmax(0,1fr)_minmax(0,1fr)] lg:gap-6">
    @if (image(); as image) {
      <div class="overflow-hidden rounded md:self-stretch">
        <picture>
          <source media="(min-width: 1024px)" [srcset]="image.largeSrc" />
          <source media="(min-width: 768px)" [srcset]="image.mediumSrc" />
          <img
            [src]="image.smallSrc"
            [alt]="image.alt"
            class="aspect-3/2 w-full object-cover"
            decoding="async"
            fetchpriority="high"
            loading="eager"
            (error)="onImageError()"
          />
        </picture>
      </div>
    } @else {
      <div
        aria-hidden="true"
        class="flex aspect-3/2 w-full items-center justify-center rounded bg-neutral-300 text-2xl font-bold text-neutral-400"
      >
        IMAGE
      </div>
    }

    <div class="flex min-w-0 flex-col">
      <p class="flex items-center gap-2 text-sm font-bold text-neutral-700">
        <img alt="" aria-hidden="true" class="size-4 shrink-0" src="/icons/calendar.svg" />
        <span>{{ hero().category }}</span>
      </p>

      <h2 class="mt-3 text-2xl font-bold leading-tight text-neutral-800 md:text-[2rem]">
        {{ hero().title }}
      </h2>

      <p class="mt-4 text-sm leading-relaxed text-neutral-700 md:text-base">
        {{ hero().description }}
      </p>

      <p
        class="mt-6 inline-flex self-end rounded-lg bg-rose-600 px-4 py-2 text-sm font-bold text-white"
      >
        {{ hero().ctaLabel }}
      </p>
    </div>
  </div>
</article>
